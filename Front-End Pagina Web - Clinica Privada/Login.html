<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="/Css/Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <section id="encabezado">
            <div class="texto-logo">
                <img src="/Recursos/Logo Clinica Privada.png" alt="logo" />
                <div class="texto-encabezado">
                    <h1>CLINICA PRIVADA</h1>
                    <p>CUIDANDOTE SIEMPRE</p>
                </div>
            </div>
        </section>
    </header>
    <nav>
        <ul>
            <li>Inicio</li>
            <li>Ubicaion</li>
            <li>Contacto</li>
            <li>Ayuda</li>
        </ul>
    </nav>
    <main>
        <section id="mainn">
            <div class="bienvenido">
                <h2>Bienvenido/a</h2>
                <p>Ingrese a su cuenta para continuar</p>
            </div>
            <div class="login">
                <h1>INICIAR SESION</h1>
                <h3>DNI</h3>
                <input id="dni" type="number" placeholder="Ingrese su DNI" required />
                <h3>Contraseña</h3>
                <input id="psw" type="password" placeholder="Ingrese su contraseña" />
                <label for="generos">Genero</label>
                <select name="generos" id="generos">
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="Hombre">Hombre</option>
                    <option value="Mujer">Mujer</option>
                    <option value="x">No Binario</option>
                </select>
                <label for="roles">Rol</label>
                <select name="roles" id="roles">
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="Medico">Medico/a</option>
                    <option value="Enfermero">Enfermeria</option>
                    <option value="Admin">Administracion</option>
                    <option value="Jefe">Jefatura</option>
                    <option value="Farmaceutico">Farmacia</option>
                </select>
                <button id="entrar" type="button" onClick="location.href='Inicio.html' ">Iniciar Sesion</button>
                <p class="recovery">¿Olvidaste tu contraseña?</p>
            </div>
        </section>
    </main>
    <footer>
        <h1>CLINICA PRIVADA</h1>
        <h4>CUIDANDOE SIEMRPE</h4>
        <p>© 2026 Clínica Privada · Todos los derechos reservados</p>
    </footer>
</body>

</html>
