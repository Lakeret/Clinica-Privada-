<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="\Clinica-Privada-\Front-End Pagina Web - Clinica Privada\Css\Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
</head>

<body>
    <header>
        <section id="encabezado">
            <div class="texto-logo">
                <img src="/Clinica-Privada-/Front-End Pagina Web - Clinica Privada/Recursos/Logo Clinica Privada.png" alt="logo" />
                <div class="texto-encabezado">
                    <h1>CLINICA PRIVADA</h1>
                    <p>CUIDANDOTE SIEMPRE</p>
                </div>
            </div>
        </section>
    </header>
    <nav>
        <ul>
            <li>Inicio</li>
            <li>Ubicación</li>
            <li>Contacto</li>
            <li>Ayuda</li>
        </ul>
    </nav>
    <main>
        <section id="mainn">
            <div class="bienvenido">
                <h2>Bienvenido/a</h2>
                <p>Ingrese a su cuenta para continuar</p>
            </div>
            <div class="login">
                <h1>INICIAR SESION</h1>
                <h3>DNI</h3>
                <input id="dni" type="number" placeholder="Ingrese su DNI" required />
                <h3>CONTRASEÑA</h3>
                <input id="psw" type="password" placeholder="Ingrese su contraseña" />
                <h3>GENERO</h3>
                <div class='genero'>
                    <label>
                        <input type="radio" name="genero" value="Femenino" /> Femenino
                    </label>
                    <label>
                        <input type="radio" name="genero" value="Masculino" /> Masculino
                    </label>
                    <label>
                        <input type="radio" name="genero" value="X" /> X
                    </label>
                </div>
                <button id="entrar" type="button" onClick="location.href='Inicio.html' " >Iniciar Sesion</button>
                <p class="recovery">¿Olvidaste tu contraseña?</p>
            </div>
        </section>
    </main>
    <footer>
        <h1>CLINICA PRIVADA</h1>
        <h4>CUIDANDOTE SIEMRPE</h4>
        <p>© 2026 Clínica Privada · Todos los derechos reservados</p>
    </footer>
</body>

</html>
